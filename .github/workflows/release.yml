name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir versão
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - name: Notas da versão
        run: |
          awk -v v="## $(cat VERSION)" 'index($0,v)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
